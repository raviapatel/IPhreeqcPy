name: Build and Deploy Wheels

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
        python-version: ['3.8']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}
        activate-environment: test-env
        miniforge-version: latest

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel cmake requests numpy 
        pip install --upgrade setuptools wheel requests numpy


    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip cmake gcc g++
        python3 -m pip install --upgrade pip
        pip install setuptools wheel requests numpy
        pip install --upgrade setuptools wheel requests numpy

    - name: Install Phreeqc
      run: python setup.py compile_phreeqc

    - name: Set platform tag
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          echo "PLAT_NAME=manylinux2014_x86_64" >> "$GITHUB_ENV"
        else
          echo "PLAT_NAME=win_amd64" >> "$GITHUB_ENV"
        fi

    - name: Build wheel
      run: python setup.py bdist_wheel --plat-name "$PLAT_NAME" --python-tag py3
        
    - name: Upload wheel to artifact
      uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ runner.os }}
        path: dist/*.whl

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Download wheel artifacts (Windows)
      uses: actions/download-artifact@v4
      with:
        name: wheel-Windows
        path: dist/windows

    - name: Download wheel artifacts (Linux)
      uses: actions/download-artifact@v4
      with:
        name: wheel-Linux
        path: dist/linux

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.x

    - name: Install twine
      run: pip install twine

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        twine check dist/*/*.whl
        twine upload --skip-existing dist/*/*.whl
